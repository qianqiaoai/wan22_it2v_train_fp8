task: i2v-5B
generator_type: bidirectional
generator_name: /mnt/data/nlp/user/qiaoqian/models/Wan2.2-TI2V-5B
# text_encoder_name is unused; prompt_embeds are loaded from caption_emb files.
vae_name: /mnt/data/nlp/user/qiaoqian/models/Wan2.2-TI2V-5B
model_kwargs:
  timestep_shift: 5.0

data_path: /mnt/data/nlp/user/qiaoqian/newproject/wan2.2_5B_fp8/raw_dataset/talkvid0918_9_16_13w.jsonl
video_root:
# data_path: OpenVidHD_faketest.jsonl
# video_root: /mnt/data/zhendingcheng/OpenVid-1M/videos/
video_reader: auto
num_frames: 81
height: 832
width: 480
target_fps: 20
load_caption_emb: true
caption_emb_key: caption_emb
default_caption_emb_path: /mnt/data/nlp/user/qiaoqian/newproject/wan2.2_5B_fp8/raw_dataset/text_emb/person_speaking_zh_umt5_xxl_bf16.pt
text_len: 512
audio_condition:
  enabled: true
  audio_emb_mode: online
  audio_emb_key: vocals_emb_base_all
  audio_emb_root:
  audio_path_key: audio_path
  audio_path_root:
  audio_model_name_or_path: /mnt/data/nlp/user/qiaoqian/models/chinese-wav2vec2-base
  audio_sample_rate: 16000
  audio_encoder_device: cpu
  audio_model_local_files_only: true
  audio_only_last_features: false
  drop_prob: 0.0
  window_size: 5
  vae_scale: 4
  layers: 12
  input_dim: 768
  intermediate_dim: 512
  context_tokens: 32
  norm_output_audio: true
  zero_init_audio_output: true
  mask_clean_first_frame: true
  audio_qk_norm:
# max_samples:
num_workers: 1

mixed_precision: true
fp8: true
gradient_checkpointing: true # 测试时显存不够改为true 训练时为false
seed: 0

num_train_timestep: 99999

sharding_strategy: hybrid_full
generator_fsdp_wrap_strategy: size
# text_encoder_fsdp_wrap_strategy is unused when load_caption_emb is true.
# text_encoder_cpu_offload is unused when load_caption_emb is true.

batch_size: 1
gradient_accumulation_steps: 8
lr: 1.0e-5
beta1: 0.0
beta2: 0.999
weight_decay: 0.0
max_grad_norm: 10.0
# max_steps: 10000
ema_start_step: 1000

logdir: logs/test
log_iters: 1000
# gc_interval: 100
save_at_end: true
disable_wandb: true
wandb_host: WANDB_HOST
wandb_key: WANDB_KEY
wandb_entity: WANDB_ENTITY
wandb_project: WANDB_PROJECT
wandb_save_dir: ""

# resume_ckpt:
